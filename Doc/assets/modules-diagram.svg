<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 720" font-family="Georgia, 'Times New Roman', serif">
  <style><![CDATA[@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap');]]></style>
  <rect x="0" y="0" width="1160" height="720" fill="#0a0d16"/>

  <!-- Título -->
  <text x="580" y="54" fill="#34d399" font-size="38" letter-spacing="3" text-anchor="middle" font-family="'Instrument Serif', Georgia, serif">MÓDULOS DEL PRODUCTO</text>

  <!-- ===== Riel izquierdo: Anonimato (transversal) ===== -->
  <rect x="50" y="90" width="72" height="575" rx="10" fill="#e8c9a8" stroke="#00000022"/>
  <text x="86" y="377" fill="#3a2a18" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90 86 377)">Anonimato estructural · enmascaramiento Fauchard</text>

  <!-- ===== Riel derecho: ContactGuard (transversal) ===== -->
  <rect x="1038" y="90" width="72" height="575" rx="10" fill="#e0822e" stroke="#00000022"/>
  <text x="1074" y="377" fill="#2a1606" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90 1074 377)">ContactGuard · moderación anti-desintermediación</text>

  <!-- ===== Superficies por rol ===== -->
  <!-- Dentista -->
  <rect x="150" y="90" width="284" height="96" rx="10" fill="#5aa544" stroke="#00000022"/>
  <text x="292" y="128" fill="#0f1a0a" font-size="20" font-weight="700" text-anchor="middle">Dentista</text>
  <text x="292" y="156" fill="#10260c" font-size="14" text-anchor="middle">crea casos · aprueba · califica</text>

  <!-- Técnico -->
  <rect x="448" y="90" width="284" height="96" rx="10" fill="#9ccb6e" stroke="#00000022"/>
  <text x="590" y="128" fill="#16240c" font-size="20" font-weight="700" text-anchor="middle">Técnico</text>
  <text x="590" y="156" fill="#16240c" font-size="14" text-anchor="middle">cotiza · entrega · fabrica</text>

  <!-- Admin -->
  <rect x="746" y="90" width="284" height="96" rx="10" fill="#b15a28" stroke="#00000022"/>
  <text x="888" y="128" fill="#fff4ea" font-size="20" font-weight="700" text-anchor="middle">Admin</text>
  <text x="888" y="156" fill="#fbe6d6" font-size="13" text-anchor="middle">config Fauchard · observabilidad · impersonación</text>

  <!-- ===== Núcleo: Motor Fauchard ===== -->
  <rect x="150" y="202" width="880" height="84" rx="12" fill="#e9a23b" stroke="#00000033" stroke-width="2"/>
  <text x="590" y="238" fill="#2a1a06" font-size="23" font-weight="700" text-anchor="middle">Motor Fauchard</text>
  <text x="590" y="266" fill="#3a2606" font-size="15" text-anchor="middle">orquestación del caso · clasificación y selección de técnicos</text>

  <!-- ===== Riel vertical: UCH (renderiza el ciclo) ===== -->
  <rect x="150" y="300" width="72" height="360" rx="10" fill="#e8c6e0" stroke="#00000022"/>
  <text x="186" y="480" fill="#3a1d34" font-size="16" font-weight="700" text-anchor="middle" transform="rotate(-90 186 480)">UCH · UnifiedCaseHub</text>

  <!-- ===== Barras: ciclo de vida del caso + módulos satélite ===== -->
  <!-- 1 -->
  <rect x="234" y="300" width="796" height="56" rx="8" fill="#cfe6f7" stroke="#00000018"/>
  <text x="632" y="334" fill="#0c2740" font-size="18" font-weight="700" text-anchor="middle">Gestión de casos &amp; flujo de estados (3 tipos de servicio)</text>
  <!-- 2 -->
  <rect x="234" y="361" width="796" height="56" rx="8" fill="#a9d3f0" stroke="#00000018"/>
  <text x="632" y="395" fill="#0c2740" font-size="18" font-weight="700" text-anchor="middle">Ofertas &amp; cotizaciones — comparativo anónimo</text>
  <!-- 3 -->
  <rect x="234" y="422" width="796" height="56" rx="8" fill="#7bbbe6" stroke="#00000018"/>
  <text x="632" y="456" fill="#08243a" font-size="18" font-weight="700" text-anchor="middle">Entregas · revisiones · fabricación &amp; despacho</text>
  <!-- 4 -->
  <rect x="234" y="483" width="796" height="56" rx="8" fill="#5aa9e0" stroke="#00000018"/>
  <text x="632" y="517" fill="#08243a" font-size="18" font-weight="700" text-anchor="middle">Modelo de disponibilidad &amp; sanciones</text>
  <!-- 5 -->
  <rect x="234" y="544" width="796" height="56" rx="8" fill="#cf9b3e" stroke="#00000018"/>
  <text x="632" y="578" fill="#2a1d06" font-size="18" font-weight="700" text-anchor="middle">Motor de Ligas (Bronce · Plata · Oro · Élite)</text>
  <!-- 6 -->
  <rect x="234" y="605" width="796" height="56" rx="8" fill="#3a8f86" stroke="#00000018"/>
  <text x="632" y="639" fill="#eafaf7" font-size="18" font-weight="700" text-anchor="middle">Calificaciones por dimensión · Catálogos · Calendario laboral</text>

  <!-- Pie -->
  <text x="590" y="695" fill="#5b6b80" font-size="13" text-anchor="middle" letter-spacing="2">SOPORTE TRANSVERSAL · Notificaciones (EmailJS) · Observabilidad</text>
</svg>
